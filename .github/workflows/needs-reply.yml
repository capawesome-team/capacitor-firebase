name: Close old issues that need reply

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: needs-reply

jobs:
  needs-reply:
    runs-on: ubuntu-latest
    if: github.repository == 'capawesome-team/capacitor-firebase'
    steps:
      - name: Close old issues that need reply
        uses: dwieeb/needs-reply@71e8d5144caa0d4a1e292348bfafa3866d08c855 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-label: 'needs: reply'
